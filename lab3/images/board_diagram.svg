    <text x="615" y="220" text-anchor="middle" font-size="12" font-weight="bold">Controller</text>
    <text x="546" y="114" font-size="9">GClock</text>
    <text x="546" y="154" font-size="9">GReset</text>
    <text x="546" y="264" font-size="9">SSCS</text>
    <text x="546" y="314" font-size="9">MSC</text>
    <text x="546" y="339" font-size="9">SSC</text>
    <text x="684" y="114" text-anchor="end" font-size="9">MSTL</text>
    <text x="684" y="144" text-anchor="end" font-size="9">SSTL</text>
    <text x="684" y="276" text-anchor="end" font-size="9">BCD1</text>
    <text x="684" y="298" text-anchor="end" font-size="9">BCD2</text>
    <text x="800" y="224" text-anchor="middle" font-size="12" font-weight="bold">sevenSeg</text>
    <text x="746" y="254" font-size="9">clk</text>
    <text x="746" y="276" font-size="9">bcd1</text>
    <text x="746" y="298" font-size="9">bcd2</text>
    <text x="746" y="320" font-size="9">rst</text>
    <text x="854" y="269" text-anchor="end" font-size="9">AN</text>
    <text x="854" y="304" text-anchor="end" font-size="9">SEG</text>
    <text x="420" y="104" text-anchor="middle" font-size="10">1 Hz</text>
    <text x="520" y="395" text-anchor="middle" font-size="10">1 kHz</text>
    <text x="24" y="305">SW[7..4] (MSC)</text>
    <text x="24" y="330">SW[3..0] (SSC)</text>
    <text x="24" y="375">CPU_RESETN</text>
    <text x="916" y="105">LED[5..3]</text>
    <text x="916" y="135">LED[2..0]</text>
    <text x="916" y="260">AN[7..0]</text>
    <text x="916" y="295">SEG[6..0]</text>
    <text x="150" y="413" font-size="10" font-style="italic">clk_div and debouncer are course-provided. CPU_RESETN is the global reset (active low).</text>
  </g>
