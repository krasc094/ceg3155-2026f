    <text x="304" y="114" text-anchor="end" font-size="9">1 Hz</text>
    <text x="304" y="174" text-anchor="end" font-size="9">1 kHz</text>
    <text x="24" y="135">CLK100MHZ</text>
    <text x="425" y="264" text-anchor="middle" font-size="12" font-weight="bold">debouncer</text>
    <text x="364" y="254" font-size="9">raw</text>
    <text x="364" y="279" font-size="9">clk</text>
    <text x="24" y="245">BTNC (car)</text>
