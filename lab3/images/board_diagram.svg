    <text x="525" y="57" text-anchor="middle" font-size="13" font-weight="bold">TopLevel_trafficLightBoard (Nexys A7)</text>
  </g>
  <g id="wires" inkscape:groupmode="layer" inkscape:label="Wires" fill="none" stroke="#000" stroke-width="1.4">
