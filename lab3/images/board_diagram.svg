    <path d="M20,250 H360" marker-end="url(#arrow)"/>
    <path d="M310,110 H540" marker-end="url(#arrow)"/>
    <path d="M340,110 V275 H360" marker-end="url(#arrow)"/>
    <path d="M310,170 H325 V400 H715 V250 H740" marker-end="url(#arrow)"/>
    <path d="M470,260 H540" marker-end="url(#arrow)"/>
    <path d="M20,310 H540" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M20,335 H540" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M20,380 H725 V316 H740" marker-end="url(#arrow)"/>
    <path d="M520,380 V150 H540" marker-end="url(#arrow)"/>
    <path d="M690,110 H960" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690,140 H960" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690,272 H740" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690,294 H740" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M860,265 H960" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M860,300 H960" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="340" cy="110" r="3.5" fill="#000"/>
    <circle cx="520" cy="380" r="3.5" fill="#000"/>
