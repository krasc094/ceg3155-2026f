<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 960" font-family="Arial, Helvetica, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
    <style>
      .box { fill: #f4f6fa; stroke: black; stroke-width: 2; }
      .dec { fill: #fff7e0; stroke: black; stroke-width: 2; }
      .term { fill: #e8f0e8; stroke: black; stroke-width: 2; }
      .w { fill: none; stroke: black; stroke-width: 1.8; }
      .yn { font-size: 15px; font-weight: bold; fill: #1f4fbf; }
      .sm { font-size: 14px; fill: #444; }
    </style>
  </defs>
  <rect width="690" height="960" fill="white"/>

  <!-- 1. reset -->
  <rect x="140" y="20" width="240" height="56" rx="28" class="term"/>
  <text x="260" y="44" text-anchor="middle" font-weight="bold">Reset</text>
  <text x="260" y="64" text-anchor="middle" class="sm">state = Waiting, n = 0</text>
  <line x1="260" y1="76" x2="260" y2="118" class="w" marker-end="url(#a)"/>

  <!-- 2. wait edge -->
  <rect x="160" y="120" width="200" height="50" class="box"/>
  <text x="260" y="142" text-anchor="middle">Wait for a filtered</text>
  <text x="260" y="162" text-anchor="middle">clock edge</text>
  <line x1="260" y1="170" x2="260" y2="188" class="w" marker-end="url(#a)"/>

  <!-- 3. KbInfo = 0 ? -->
  <polygon points="260,190 370,240 260,290 150,240" class="dec"/>
  <text x="260" y="246" text-anchor="middle">KbInfo = 0 ?</text>
  <polyline points="370,240 480,240 480,145 362,145" class="w" marker-end="url(#a)"/>
  <text x="385" y="232" class="yn">No</text>
  <line x1="260" y1="290" x2="260" y2="318" class="w" marker-end="url(#a)"/>
  <text x="268" y="310" class="yn">Yes (start bit)</text>

  <!-- 4. go to reading -->
  <rect x="160" y="320" width="200" height="50" class="box"/>
  <text x="260" y="342" text-anchor="middle">Go to Reading</text>
  <text x="260" y="362" text-anchor="middle" class="sm">counter enabled, n = 0</text>
  <line x1="260" y1="370" x2="260" y2="418" class="w" marker-end="url(#a)"/>
  <circle cx="260" cy="395" r="4"/>

  <!-- 5. wait edge -->
  <rect x="160" y="420" width="200" height="50" class="box"/>
  <text x="260" y="442" text-anchor="middle">Wait for a filtered</text>
  <text x="260" y="462" text-anchor="middle">clock edge</text>
  <line x1="260" y1="470" x2="260" y2="488" class="w" marker-end="url(#a)"/>

  <!-- 6. n >= 9 ? -->
  <polygon points="260,490 370,540 260,590 150,540" class="dec"/>
  <text x="260" y="537" text-anchor="middle">n &#8805; 9 ?</text>
  <text x="260" y="557" text-anchor="middle" class="sm">(countDone)</text>
  <line x1="370" y1="540" x2="438" y2="540" class="w" marker-end="url(#a)"/>
  <text x="380" y="532" class="yn">Yes</text>

  <!-- right column: load + display -->
  <rect x="440" y="510" width="210" height="60" class="box"/>
  <text x="545" y="535" text-anchor="middle">Load display register,</text>
  <text x="545" y="557" text-anchor="middle">go back to Waiting</text>
  <line x1="545" y1="570" x2="545" y2="608" class="w" marker-end="url(#a)"/>
  <rect x="440" y="610" width="210" height="60" class="box"/>
  <text x="545" y="635" text-anchor="middle">Decoder shows the low</text>
  <text x="545" y="657" text-anchor="middle">4 bits on BCD1, BCD2</text>
  <polyline points="650,640 675,640 675,98 260,98" class="w"/>
  <circle cx="260" cy="98" r="4"/>

  <!-- n >= 9 No -->
  <line x1="260" y1="590" x2="260" y2="618" class="w" marker-end="url(#a)"/>
  <text x="268" y="610" class="yn">No</text>

  <!-- 7. n < 8 ? -->
  <polygon points="260,620 370,670 260,720 150,670" class="dec"/>
  <text x="260" y="667" text-anchor="middle">n &lt; 8 ?</text>
  <text x="260" y="687" text-anchor="middle" class="sm">(isData)</text>
  <line x1="260" y1="720" x2="260" y2="748" class="w" marker-end="url(#a)"/>
  <text x="268" y="740" class="yn">Yes (data bit)</text>
  <polyline points="150,670 70,670 70,855 158,855" class="w" marker-end="url(#a)"/>
  <text x="76" y="662" class="yn">No (parity)</text>

  <!-- 8. shift -->
  <rect x="160" y="750" width="200" height="50" class="box"/>
  <text x="260" y="772" text-anchor="middle">Shift KbInfo into</text>
  <text x="260" y="792" text-anchor="middle">the serial register</text>
  <line x1="260" y1="800" x2="260" y2="828" class="w" marker-end="url(#a)"/>

  <!-- 9. n = n + 1 -->
  <rect x="160" y="830" width="200" height="50" class="box"/>
  <text x="260" y="861" text-anchor="middle">n = n + 1</text>
  <polyline points="260,880 260,920 30,920 30,395 260,395" class="w"/>
</svg>
